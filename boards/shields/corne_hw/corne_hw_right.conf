# The right half is the split peripheral: it sends its keys to the left
# half, never to a computer, so ZMK has no USB output for it. The
# nice!nano board turns ZMK_USB on for every half; turning it off here,
# after the board's defaults, stops the build warning (BUG-6). Flashing
# (the bootloader) and charging don't depend on it.
CONFIG_ZMK_USB=n
