# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Enable OLED display for SSD1306 on I2C
CONFIG_ZMK_DISPLAY=n

# Enable sleep and idle timeout (10 minutes)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Bluetooth and USB name (FEAT-12): 16 characters at most. Changing it only
# takes effect after flashing settings_reset, which also clears pairings.
CONFIG_ZMK_KEYBOARD_NAME="Clavier Vincent"
