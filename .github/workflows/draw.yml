name: Draw keymap

# Redraws keymap-drawer/corne_hw.svg (FEAT-5) whenever the keymap or its
# drawing setup changes, keymap-editor commits included, and commits it
# to the pushed branch. Commits pushed with GITHUB_TOKEN start no other
# workflow, so the drawing commit doesn't rebuild the firmware. The A4
# cheatsheet PDF is attached to the run, never committed.
# The audit (tools/audit_drawing.py) checks the drawing first.
on:
  push:
    branches: [main, dev]
    paths:
      - 'config/corne_hw.keymap'
      - 'config/corne_hw.json'
      - 'keymap_drawer.config.yaml'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'tools/audit_drawing.py'
      - '.github/workflows/draw.yml'
  workflow_dispatch:

concurrency:
  group: draw-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
      # Redraws the SVG, then makes the PDF from it.
      - run: pixi run cheatsheet
      # Fails before anything is committed if a legend doesn't type what it
      # shows, or a layer lost its opening thumb (FEAT-17).
      - run: pixi run audit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: keymap-drawer/cheatsheet.pdf
          archive: false
          if-no-files-found: error
      - name: Commit the drawing if it changed
        run: |
          git add keymap-drawer
          if git diff --cached --quiet; then
            echo "Drawing already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: redraw the keymap" \
            -m "Generated by .github/workflows/draw.yml from ${GITHUB_SHA::7}." \
            -m "Effect on push: docs only."
          git push origin "HEAD:${GITHUB_REF_NAME}"
