name: Build ZMK Firmware

on:
  push:
    # Docs-only pushes don't change the firmware (BUG-2), and neither
    # does the keymap drawing or its setup (FEAT-5).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'keymap-drawer/**'
      - 'keymap_drawer.config.yaml'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.github/workflows/draw.yml'
  workflow_dispatch:

jobs:
  build:
    # Pinned (BUG-1): must match the zmk revision in config/west.yml.
    # Upgrade both in one commit.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85
